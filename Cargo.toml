[package]
name = "potlatch"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
regex = "1.11"
chrono = "0.4"
toml = "0.8"
rand = "0.10.0"
signal-hook = "0.4.3"
terminal_size = "0.4.4"
reqwest = { version = "0.12", features = ["blocking", "json", "stream"] }
glob = "0.3"
uuid = { version = "1.0", features = ["v4"] }
tiktoken-rs = "0.6"
html2text = "0.17"
ignore = "0.4"
grep-searcher = "0.1"
grep-regex = "0.1"
libc = "0.2"
dissimilar = "1.0"
headless_chrome = "1.0.22"
fs2 = "0.4.3"
