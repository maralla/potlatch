[package]
name = "potlatch"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
regex = "1.11"
chrono = "0.4"
toml = "0.8"
rand = "0.10.0"
signal-hook = "0.4.3"
terminal_size = "0.4.4"
